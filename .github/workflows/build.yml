name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixin-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk unzip zip ccache autoconf libtool pkg-config lld cmake libffi-dev libssl-dev || true
          pip install --upgrade pip setuptools wheel "cython<3.0.0" buildozer

      - name: Build with Buildozer
        run: |
          export BUILDOZER_ALLOW_KIVY_BUILD_ROOT=1
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
        with:
          name: package
          path: bin/*.apk
